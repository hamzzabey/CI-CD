config:
  target: "http://httpbin.org/"
  phases:
    - duration: 1
      arrivalRate: 2
      name: GoIT Performance Test
  plugins:
    ensure:
      thresholds:
        -  http.response_time.max: 2000
        -  http.response_time.2xx.p95: 1000
      conditions:
        - expression: http.response == 2
        - expression: vusers.failed ==0 
     

scenarios:
  - name: Create Account
    flow:
      - post:
          url: "{{ target }}post"
          json:
            username: "GoIT"
            password: "12345"
          headers:
           Content-Type: "application/json"
          capture:
            - json: "$.json" 
              as: "response_body"
            - json: "$.headers.Host"  
              as: "host"
      - log: "Response Body : {{response_body}}"        
      - log: "Host : {{host}}"
          